<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação Acadêmica</title>
    <!-- Fonte Moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <header class="card-header">
            <div class="icon">🎓</div>
            <h2>Painel do Aluno</h2>
            <p>Insira as notas para calcular a situação acadêmica.</p>
        </header>

        <form id="formNotas" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="nota1">1º Bimestre</label>
                <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 8.5" required>
            </div>

            <div class="input-group">
                <label for="nota2">2º Bimestre</label>
                <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 6.0" required>
            </div>

            <div class="actions">
                <button type="button" id="btnCalcular" class="btn btn-primary">Calcular Média</button>
                <button type="button" id="btnLimpar" class="btn btn-secondary">Limpar</button>
            </div>
        </form>

        <div id="painelResultado" class="resultado-box hidden">
            <span id="badgeStatus" class="badge">--</span>
            <h3 id="txtMedia">Média: --</h3>
            <p id="txtMensagem">--</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
